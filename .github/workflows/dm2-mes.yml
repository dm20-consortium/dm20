name: Build and Push dm2-mes

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ['22.04', '24.04']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dm2 libraries
      - name: Build secLib
        working-directory: dm2
        run: |
          docker build \
            -f secLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/seclib:${{ matrix.ubuntu_version }} \
            secLib/

      - name: Build csLib
        working-directory: dm2
        run: |
          docker build \
            -f csLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/cslib:${{ matrix.ubuntu_version }} \
            csLib/

      - name: Build commonLib
        working-directory: dm2
        run: |
          docker build \
            -f commonLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/commonlib:${{ matrix.ubuntu_version }} \
            commonLib/

      - name: Build proto intermediate image
        working-directory: dm2
        run: |
          docker build \
            -f proto/Dockerfile.proto.${{ matrix.ubuntu_version }} \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/protoc:${{ matrix.ubuntu_version }} \
            proto/

      - name: Build proto
        working-directory: dm2
        run: |
          docker build \
            -f proto/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/proto:${{ matrix.ubuntu_version }} \
            proto/

      - name: Build tupleLib
        working-directory: dm2
        run: |
          docker build \
            -f tupleLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            --build-arg CPLUS_VER=c++17 \
            -t dm2/tuplelib:${{ matrix.ubuntu_version }} \
            ./

      - name: Build dmClientLib
        working-directory: dm2
        run: |
          docker build \
            -f dmClientLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            --build-arg CPLUS_VER=c++17 \
            -t dm2/dmclientlib:${{ matrix.ubuntu_version }} \
            ./

      # final image
      - name: Build dm2-mes
        working-directory: dm2
        run: |
          docker build \
            -f apl/dm2mes/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            --build-arg CPLUS_VER=c++17 \
            -t ghcr.io/dm20-consortium/dm2-mes:${{ github.ref_name }}-ubuntu${{ matrix.ubuntu_version }} \
            ./

      - name: Push OS-specific version
        run: |
          docker push ghcr.io/dm20-consortium/dm2-mes:${{ github.ref_name }}-ubuntu${{ matrix.ubuntu_version }}

      - name: Push OS-specific latest
        run: |
          IMAGE=ghcr.io/dm20-consortium/dm2-mes
          VERSION=${{ github.ref_name }}
          OS=${{ matrix.ubuntu_version }}
          docker tag "${IMAGE}:${VERSION}-ubuntu${OS}" "${IMAGE}:latest-ubuntu${OS}"
          docker push "${IMAGE}:latest-ubuntu${OS}"

      # Keep legacy tags on Ubuntu 24.04 only
      - name: Push version and latest
        if: matrix.ubuntu_version == '24.04'
        run: |
          IMAGE=ghcr.io/dm20-consortium/dm2-mes
          VERSION=${{ github.ref_name }}
          docker tag "${IMAGE}:${VERSION}-ubuntu24.04" "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${VERSION}-ubuntu24.04" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
