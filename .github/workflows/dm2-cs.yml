name: Build and Push dm2-cs

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ['22.04', '24.04']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build base
        working-directory: dm2
        run: |
          docker build \
            -f base/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/base:${{ matrix.ubuntu_version }} \
            base/

      - name: Build secLib
        working-directory: dm2
        run: |
          docker build \
            -f secLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/seclib:${{ matrix.ubuntu_version }} \
            secLib/

      - name: Build csLib
        working-directory: dm2
        run: |
          docker build \
            -f csLib/Dockerfile \
            --build-arg IMAGE_TAG=${{ matrix.ubuntu_version }} \
            -t dm2/cslib:${{ matrix.ubuntu_version }} \
            csLib/

      - name: Build dm2-cs
        working-directory: dm2
        run: |
          IMAGE=ghcr.io/dm20-consortium/dm2-cs
          VERSION=${{ github.ref_name }}
          OS=${{ matrix.ubuntu_version }}
          docker build \
            -f cs/Dockerfile \
            --build-arg IMAGE_TAG="${OS}" \
            -t "${IMAGE}:${VERSION}-ubuntu${OS}" \
            ./

      - name: Push OS-specific version and latest
        run: |
          IMAGE=ghcr.io/dm20-consortium/dm2-cs
          VERSION=${{ github.ref_name }}
          OS=${{ matrix.ubuntu_version }}
          docker tag "${IMAGE}:${VERSION}-ubuntu${OS}" "${IMAGE}:latest-ubuntu${OS}"
          docker push "${IMAGE}:${VERSION}-ubuntu${OS}"
          docker push "${IMAGE}:latest-ubuntu${OS}"

      - name: Push default version and latest (Ubuntu 24.04)
        if: matrix.ubuntu_version == '24.04'
        run: |
          IMAGE=ghcr.io/dm20-consortium/dm2-cs
          VERSION=${{ github.ref_name }}
          docker tag "${IMAGE}:${VERSION}-ubuntu24.04" "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${VERSION}-ubuntu24.04" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
