name: Build and Push dm2-web-viewer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: viewer/web-viewer
          push: true
          tags: |
            ghcr.io/dm20-consortium/dm2-web-viewer:${{ github.ref_name }}
            ghcr.io/dm20-consortium/dm2-web-viewer:latest